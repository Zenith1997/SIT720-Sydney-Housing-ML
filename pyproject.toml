[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sydney-housing-estimator"
version = "0.1.0"
description = "Reproducible training and an experimental Sydney housing prediction interface"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
app = ["gradio>=4.44,<7"]
dev = ["pytest>=8,<10", "jupyter>=1.0,<2", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
